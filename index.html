<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OP Monster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game">
      <div id="game-hud">
        <div id="hud-player-health"></div>
        <div id="hud-player-score">
          <span class="hud-score-zero-prefix">0</span><span class="hud-score-current"></span>
        </div>
        <div id="hud-elapsed-game-time"><label>0:00</label></div>
      </div>
      <div id="maze"></div>
      <div id="game-foot">
        <b>Controls:</b>
        <br />
        <b>Hold</b> a direction key <b>(W, A, S, or D)</b> to choose which way to move.
        <br />
        Then press <b>O and P alternately</b> to move in that direction.
      </div>
      <div id="game-splash" class="is-hidden game-screen-show">
        <!-- <div id="game-splash" class="is-hidden"> -->
        <div id="game-splash-prompt" class="game-prompt">
          <div class="prompt-title">OP MONSTER</div>
          <div id="game-splash-leaderboard" class="leaderboard-group">
            <div class="prompt-sub-title">Top Ranks</div>
          </div>
          <div>
            <div id="onboarding-instruction"></div>
            <div id="onboarding-maze"></div>
          </div>
          <input type="button" id="game-start-button" class="ui-button" value="Start Game" />
        </div>
      </div>
      <div id="game-countdown" class="is-hidden">
        <div id="countdown-message"></div>
      </div>
      <!-- <div id="game-over" class="is-hidden game-screen-show"> -->
      <div id="game-over" class="is-hidden">
        <div id="game-over-prompt" class="game-prompt">
          <div class="prompt-title">GAME OVER</div>
          <div id="game-over-leaderboard" class="leaderboard-group">
            <div class="prompt-sub-title">Top Ranks</div>
          </div>
          <div id="game-results">
            <div class="results-score-time">0000000000 | Time: 0:00</div>
            <div id="leaderboard-initials" class="is-hidden">
              <div id="initials-maze"></div>
              <div>Press ENTER to submit</div>
            </div>
          </div>
          <input type="button" id="game-home-button" class="ui-button" value="Back to Menu" />
        </div>
      </div>
    </div>
  </body>
  <script src="mazeLevelData.js"></script>
  <script src="script.js"></script>
</html>
