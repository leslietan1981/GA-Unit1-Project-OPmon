<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OP Monster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game">
      <div id="game-hud">
        <div id="hud-player-health"></div>
        <div id="hud-player-score">
          <span class="hud-score-zero-prefix">0</span><span class="hud-score-current"></span>
        </div>
        <div id="hud-elapsed-game-time"><label>0:00</label></div>
      </div>
      <div id="maze"></div>
      <div id="game-foot">
        Controls: Hold WASD for direction and press OP alternately to move in the held direction.
      </div>
      <div id="game-splash" class="is-hidden game-screen-show">
        <!-- <div id="game-splash" class="is-hidden"> -->
        <div id="game-splash-prompt" class="game-prompt">
          <div id="game-splash-title">OP MONSTER</div>
          <div id="game-splash-leaderboard">
            <div class="leaderboard-title">Top 3 OP</div>
          </div>
          <input type="button" id="game-start-button" value="Start Game" />
        </div>
      </div>
      <div id="game-countdown" class="is-hidden">
        <div id="countdown-message"></div>
      </div>
      <!-- <div id="game-over" class="is-hidden game-screen-show"> -->
      <div id="game-over" class="is-hidden">
        <div id="game-over-prompt" class="game-prompt">
          <div id="game-over-title">GAME OVER</div>
          <div id="game-over-leaderboard">
            <div class="leaderboard-title">Top 3 OP</div>
          </div>
          <div id="game-results">
            <div class="results-title">Your Score</div>
            <div class="results-score-time">0000000000 | Time: 0:00</div>
          </div>
          <div id="leaderboard-initials" class="is-hidden">
            <div class="initials-title">Enter your initials</div>
            <div id="initials-maze"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="mazeLevelData.js"></script>
  <script src="script.js"></script>
</html>
